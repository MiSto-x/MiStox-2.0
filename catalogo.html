<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="tituloPagina">Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g1:#7A3958; --g2:#4F2969; --g3:#2F478C; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Outfit',sans-serif;background:#F7F5FC;color:#211A33;}
  a{color:inherit;}

  .navbar-top{background:#000;color:#fff;padding:10px 24px;display:flex;gap:24px;font-size:13px;font-weight:600;}
  .navbar-top a{color:#fff;text-decoration:none;margin-right:24px;cursor:pointer;}
  .navbar-top a:last-child{margin-right:0;}
  .navbar-top a:hover{opacity:0.8;}

  .encabezado-fijo{position:sticky;top:0;z-index:50;}

  .lightbox-overlay-cat{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;padding:24px;}
  .lightbox-overlay-cat.abierto{display:flex;}
  .lightbox-overlay-cat img{max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5);object-fit:contain;}
  .lightbox-overlay-cat button{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .lightbox-overlay-cat button:hover{background:rgba(255,255,255,0.28);}
  .product-image, .recientes-img-wrap{cursor:pointer;}

  .seccion-titulo{text-align:center;font-size:36px;font-weight:300;color:#7C3AED;margin:0 0 8px;}
  .seccion-subtitulo{text-align:center;font-size:16px;color:#6B7280;margin:0 0 32px;font-weight:500;}

  .hero-carousel{position:relative;height:600px;overflow:hidden;background:linear-gradient(135deg, var(--g1), var(--g2), var(--g3));display:flex;align-items:flex-end;}
  .hero-layer{position:absolute;top:0;left:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none;user-select:none;-webkit-user-drag:none;}
  .hero-layer.activo{opacity:1;}
  .hero-overlay{position:relative;z-index:2;width:100%;box-sizing:border-box;padding:0 32px 56px;background:linear-gradient(to top, rgba(0,0,0,0.55), transparent);}
  .hero-overlay h2{margin:0 0 8px;font-size:clamp(24px,4vw,42px);font-weight:800;color:#fff;max-width:700px;}
  .hero-overlay p{margin:0;font-size:clamp(14px,2vw,18px);color:rgba(255,255,255,0.9);max-width:600px;}
  @media (max-width:760px){
    .hero-carousel{height:300px;}
    .hero-overlay{padding:0 20px 28px;}
  }

  .marcas-section{max-width:1100px;margin:64px auto;padding:0 24px;}
  .marcas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2rem;}
  .marca-circulo{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.12);transition:transform 0.25s ease, box-shadow 0.25s ease;background:#F3F4F6;}
  .marca-circulo:hover{transform:translateY(-10px);box-shadow:0 14px 28px rgba(0,0,0,0.22);}
  .marca-img{position:absolute;display:block;}
  .marca-overlay{position:absolute;inset:0;background:linear-gradient(135deg, rgba(6,127,130,0.3), rgba(124,58,237,0.3));}
  .marca-nombre{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10%;font-weight:700;z-index:2;line-height:1.25;}

  .recientes-section{max-width:1300px;margin:64px auto;padding:0 24px;}
  .recientes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.5rem;justify-items:center;align-items:start;}
  @media (max-width:760px){
    .recientes-section{padding:0 16px;margin:40px auto;}
    .recientes-grid{grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:0.7rem;}
    .recientes-info{padding:10px 10px 12px;}
    .recientes-nombre{font-size:13px;height:50px;margin-bottom:2px;}
    .recientes-marca{font-size:9.5px;}
    .recientes-formato{font-size:10.5px;margin-bottom:6px;}
    .recientes-precio{font-size:17px;min-height:36px;}
    .recientes-footer{gap:6px;}
    .recientes-add-btn{width:28px;height:28px;font-size:14px;flex-shrink:0;}
  }
  .recientes-card{width:100%;max-width:290px;background:#fff;border:2px solid #E7E1F7;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;transition:transform 0.25s ease, box-shadow 0.25s ease;box-shadow:0 2px 14px rgba(0,0,0,0.06);box-sizing:border-box;}
  .recientes-card:hover{transform:translateY(-8px);box-shadow:0 10px 26px rgba(0,0,0,0.14);}
  .recientes-img-wrap{width:calc(100% - 20px);aspect-ratio:1/1;margin:10px auto 0;border-radius:24px;overflow:hidden;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:70px;flex-shrink:0;}
  .recientes-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .recientes-info{padding:12px 16px 16px;display:flex;flex-direction:column;}
  .recientes-marca{font-size:11px;color:#067F82;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
  .recientes-nombre{font-size:14.5px;font-weight:600;color:#7C3AED;line-height:1.35;height:58px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
  .recientes-formato{font-size:12px;color:#9CA3AF;font-weight:500;margin-bottom:10px;height:33.6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .recientes-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;}
  .recientes-precio{font-size:25px;font-weight:700;color:#7C3AED;min-height:52px;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .recientes-add-btn{width:40px;height:40px;border-radius:50%;background:#F97316;color:#fff;border:none;font-size:19px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(249,115,22,0.3);transition:all 0.25s;}
  .recientes-add-btn:hover{transform:scale(1.1);background:#EA580C;}

  header{background:linear-gradient(90deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);color:#fff;
    padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .header-logo{display:flex;align-items:center;flex-shrink:0;}
  .header-logo img{height:46px;display:block;}
  .header-logo h1{margin:0;font-size:20px;font-weight:800;}
  .header-buscar{flex:1;min-width:180px;max-width:460px;}
  .header-buscar input{width:100%;padding:10px 16px;border-radius:999px;border:none;font-size:14px;font-family:inherit;background:#F5F5F5;color:#211A33;}
  .header-carrito{position:relative;flex-shrink:0;cursor:pointer;display:flex;align-items:center;}
  .header-carrito svg{width:26px;height:26px;stroke:#fff;}
  .header-carrito-badge{position:absolute;top:-7px;right:-9px;background:#fff;color:var(--g2);font-size:10px;font-weight:800;
    border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  @media (max-width:640px){
    header{gap:10px;padding:12px 16px;flex-wrap:nowrap;}
    .header-logo img{height:32px;}
    .header-logo h1{font-size:16px;}
    .header-buscar{min-width:0;flex:1 1 auto;order:2;}
    .header-buscar input{padding:9px 14px;font-size:13px;}
    .header-carrito{order:3;}
    .header-carrito svg{width:22px;height:22px;}
  }

  .productos-layout{max-width:1400px;margin:20px auto 0;padding:0 16px 20px;display:flex;gap:32px;align-items:flex-start;}
  .filtros-sidebar{width:190px;flex-shrink:0;}
  .filtro-grupo{margin-bottom:28px;}
  .filtro-grupo h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:#211A33;margin:0 0 10px;}
  .filtro-lista{display:flex;flex-direction:column;}
  .filtro-check{
    display:flex;align-items:center;gap:9px;padding:5px 0;
    font-family:inherit;font-size:13.5px;font-weight:600;color:#4B5563;cursor:pointer;line-height:1.4;
  }
  .filtro-check:hover{color:#7C3AED;}
  .filtro-check input{width:15px;height:15px;flex-shrink:0;accent-color:#7C3AED;cursor:pointer;}
  .filtro-check.todas{font-weight:800;color:#211A33;margin-bottom:2px;}
  .productos-contenido{flex:1;min-width:0;}
  .productos-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-bottom:4px;position:relative;z-index:5;}
  .orden-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .orden-label{font-size:12.5px;font-weight:700;color:#6B7280;white-space:nowrap;}
  .orden-combo{position:relative;}
  .orden-combo-trigger{
    display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;border:1.5px solid #E7E1F7;background:#fff;
    font-family:inherit;font-size:12.5px;font-weight:700;color:#211A33;cursor:pointer;white-space:nowrap;
  }
  .orden-combo-trigger svg{width:14px;height:14px;flex-shrink:0;color:#8A82A8;transition:transform .15s;}
  .orden-combo.abierto .orden-combo-trigger{border-color:#7C3AED;}
  .orden-combo.abierto .orden-combo-trigger svg{transform:rotate(180deg);}
  .orden-combo-panel{
    display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:220px;background:#fff;
    border-radius:14px;box-shadow:0 10px 28px rgba(33,26,51,0.18);border:1px solid #EFEAFB;padding:6px;z-index:30;
  }
  .orden-combo.abierto .orden-combo-panel{display:block;}
  .orden-combo-item{
    display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;border-radius:10px;
    font-family:inherit;font-size:13px;font-weight:600;color:#4B5563;cursor:pointer;
  }
  .orden-combo-item:hover{background:#F5F2FD;}
  .orden-combo-item.activo{background:#F1EDFB;color:#7C3AED;font-weight:800;}
  .filtros-sidebar-header-movil{display:none;}
  .btn-filtros-movil{display:none;}
  .filtros-backdrop-movil{display:none;}
  @media (max-width:760px){
    .productos-layout{flex-direction:column;}
    .productos-contenido{width:100%;}
    .filtros-sidebar{
      display:none;width:100%;
      position:fixed;inset:0;z-index:70;background:#fff;
      overflow-y:auto;padding:0 20px 24px;
    }
    .filtros-sidebar.abierto-movil{display:block;}
    .filtros-sidebar-header-movil{
      display:flex;align-items:center;justify-content:space-between;
      padding:18px 0;margin-bottom:6px;border-bottom:1px solid #EFEAFB;
      font-size:16px;font-weight:800;color:#211A33;
      position:sticky;top:0;background:#fff;
    }
    .filtros-sidebar-header-movil button{background:#F3F4F6;border:none;border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#4B5563;cursor:pointer;}
    .filtro-grupo{margin-bottom:24px;flex-shrink:0;}
    .filtro-lista{flex-direction:column;gap:0;}
    .filtro-check{white-space:normal;padding:8px 0;}
    .filtros-backdrop-movil.abierto{display:block;position:fixed;inset:0;background:rgba(33,26,51,0.45);z-index:65;}
    .btn-filtros-movil{
      display:flex;position:fixed;right:18px;bottom:18px;z-index:40;
      width:52px;height:52px;border-radius:50%;align-items:center;justify-content:center;
      background:#7C3AED;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(124,58,237,0.4);
      transition:opacity 0.2s ease, transform 0.2s ease;
    }
    .btn-filtros-movil svg{width:22px;height:22px;}
    .btn-filtros-movil.oculto{opacity:0;pointer-events:none;transform:translateY(20px);}
  }

  .products-grid{width:100%;margin:24px 0 100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.25rem;align-items:start;}
  @media (max-width:760px){
    .products-grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:0.7rem;}
    .product-info{padding:10px 10px 12px;}
    .product-name{font-size:13px;height:50px;margin-bottom:2px;}
    .product-category{font-size:9.5px;}
    .product-description{font-size:10.5px;margin-bottom:6px;}
    .product-price{font-size:17px;min-height:36px;}
    .product-footer{gap:6px;}
    .product-add-btn{width:28px;height:28px;font-size:14px;flex-shrink:0;}
  }
  .product-card{
    width:100%;max-width:290px;background:#fff;border:2px solid #E7E1F7;border-radius:28px;overflow:hidden;
    display:flex;flex-direction:column;transition:transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow:0 2px 14px rgba(0,0,0,0.06);box-sizing:border-box;justify-self:center;
  }
  .product-card:hover{transform:translateY(-8px);box-shadow:0 10px 26px rgba(0,0,0,0.14);}
  .product-image{
    width:calc(100% - 20px);aspect-ratio:1/1;margin:10px auto 0;
    background:#F3F4F6;
    display:flex;align-items:center;justify-content:center;font-size:70px;
    position:relative;overflow:hidden;border-radius:24px;flex-shrink:0;
  }
  .product-image img{width:100%;height:100%;object-fit:cover;display:block;}
  .product-info{padding:12px 16px 16px;display:flex;flex-direction:column;}
  .product-category{font-size:11px;color:#067F82;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
  .product-name{
    font-size:14.5px;font-weight:600;margin-bottom:4px;color:#7C3AED;line-height:1.35;height:58px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;
  }
  .product-description{font-size:12px;color:#9CA3AF;margin-bottom:10px;line-height:1.4;font-weight:500;height:33.6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .product-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;}
  .product-price{font-size:25px;font-weight:700;color:#7C3AED;min-height:52px;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .product-add-btn{
    width:40px;height:40px;border-radius:50%;background:#F97316;color:#fff;
    border:none;font-size:19px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all 0.25s;flex-shrink:0;box-shadow:0 2px 8px rgba(249,115,22,0.3);
  }
  .product-add-btn:hover{transform:scale(1.1);background:#EA580C;}
  .vacio-cat{text-align:center;color:#8A82A8;padding:60px 20px;font-size:14px;grid-column:1/-1;}

  .carrito-barra{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E7E1F7;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 -8px 20px rgba(0,0,0,0.06);z-index:20;}
  .carrito-info{flex:1;font-size:13px;font-weight:700;cursor:pointer;}
  .carrito-total{font-size:15px;font-weight:800;}
  .btn-whatsapp{background:linear-gradient(90deg, var(--g1), var(--g2), var(--g3));color:#fff;border:none;border-radius:999px;padding:12px 20px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;}
  .btn-whatsapp:disabled{opacity:0.5;cursor:not-allowed;}

  .carrito-overlay{
    position:fixed;inset:0;background:rgba(33,26,51,0.55);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 0.25s;
  }
  .carrito-overlay.abierto{opacity:1;pointer-events:auto;}
  .carrito-modal{
    background:#fff;width:100%;max-width:520px;max-height:85vh;
    border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 -10px 40px rgba(0,0,0,0.25);
    transform:translateY(40px);transition:transform 0.25s;
  }
  .carrito-overlay.abierto .carrito-modal{transform:translateY(0);}
  @media (min-width:640px){
    .carrito-overlay{align-items:center;}
    .carrito-modal{border-radius:24px;max-height:80vh;}
  }
  .carrito-modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #EEE;flex-shrink:0;}
  .carrito-modal-header h2{margin:0;font-size:18px;font-weight:800;color:#211A33;}
  .carrito-cerrar{background:none;border:none;font-size:28px;line-height:1;cursor:pointer;color:#8A82A8;padding:0;}
  .carrito-modal-body{flex:1;overflow-y:auto;padding:4px 24px;}
  .carrito-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #F1EDFB;}
  .carrito-item:last-child{border-bottom:none;}
  .carrito-item-img{width:54px;height:54px;border-radius:12px;background:#F3F4F6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;}
  .carrito-item-img img{width:100%;height:100%;object-fit:cover;}
  .carrito-item-info{flex:1;min-width:0;}
  .carrito-item-nombre{font-size:14px;font-weight:700;color:#211A33;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .carrito-item-precio{font-size:12px;color:#8A82A8;font-weight:600;}
  .carrito-item-cantidad{display:flex;align-items:center;gap:7px;flex-shrink:0;}
  .carrito-qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid #E7E1F7;background:#fff;color:#7C3AED;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .carrito-qty-btn:hover{background:#F1EDFB;}
  .carrito-item-qty-num{min-width:18px;text-align:center;font-weight:700;font-size:14px;}
  .carrito-item-subtotal{font-size:13.5px;font-weight:800;color:#211A33;min-width:64px;text-align:right;flex-shrink:0;}
  .carrito-item-eliminar{background:none;border:none;color:#E11D48;cursor:pointer;font-size:15px;padding:4px;flex-shrink:0;}
  .carrito-vacio{text-align:center;color:#8A82A8;padding:50px 20px;font-size:14px;}
  .carrito-modal-footer{padding:16px 24px 22px;border-top:1px solid #EEE;flex-shrink:0;}
  .carrito-modal-total{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:800;color:#211A33;margin-bottom:14px;}
  .carrito-modal-footer .btn-whatsapp{width:100%;padding:14px;font-size:14px;}

  footer{background:linear-gradient(90deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);color:#fff;margin-top:32px;padding:48px 32px 24px;}
  .footer-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(140px,1fr);gap:40px;}
  .footer-col h3{margin:0 0 14px;font-size:13px;font-weight:800;letter-spacing:0.4px;text-transform:uppercase;}
  .footer-col-sobre{order:1;}
  .footer-sobre{max-width:100%;font-size:13.5px;line-height:1.6;color:rgba(255,255,255,0.9);margin:0 0 10px;}
  .footer-revista{
    display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:#fff;
    text-decoration:none;
  }
  .footer-revista:hover{text-decoration:underline;}
  .footer-links{order:2;display:grid;grid-template-columns:1fr 1fr;gap:32px;justify-self:end;}
  .footer-col a{display:block;font-size:13.5px;font-weight:600;color:#fff;text-decoration:none;margin-bottom:10px;}
  .footer-col a:hover{text-decoration:underline;}
  .footer-divider{max-width:1100px;margin:32px auto 18px;border:none;border-top:1px solid rgba(255,255,255,0.25);}
  .footer-copy{text-align:center;font-size:12px;color:rgba(255,255,255,0.75);padding-bottom:4px;}
  @media (max-width:760px){
    footer{padding:36px 24px 20px;}
    .footer-grid{grid-template-columns:1fr;gap:28px;justify-items:center;text-align:center;}
    .footer-col-sobre{order:1;}
    .footer-sobre{margin-left:auto;margin-right:auto;}
    .footer-revista{justify-content:center;}
    .footer-links{order:2;justify-self:center;grid-template-columns:1fr 1fr;gap:24px;}
  }
  @media (max-width:420px){
    .footer-links{grid-template-columns:1fr;gap:22px;}
  }
</style>
</head>
<body id="top">
  <div class="lightbox-overlay-cat" id="lightboxOverlayCat">
    <img id="lightboxImgCat" src="" alt="">
    <button type="button" id="btnCerrarLightboxCat" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="encabezado-fijo" id="encabezadoFijo">
    <nav class="navbar-top">
      <a href="#" id="navInicio">Inicio</a>
      <a href="#" id="navProductos">Productos</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://keeziqtbxphkhkvguckt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZXppcXRieHBoa2hrdmd1Y2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MTY1ODQsImV4cCI6MjEwNTA5MjU4NH0.Bg6myW2CzCz2aVxrPBJgUi0NyLiXIbNUiTDsrRnL5iE';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let productos = [];
    let telefono = '';
    let heroSlides = [];
    let marcasCat = [];

    const carrito = {};

    function categoriasDePublico(row){
      if(Array.isArray(row.categorias) && row.categorias.length) return row.categorias;
      return row.categoria ? [row.categoria] : [];
    }

    async function cargarDatosPublicos(){
      const [{ data: filasProductos }, { data: config }, { data: perfil }] = await Promise.all([
        sb.from('productos').select('*'),
        sb.from('catalogo_config').select('*').maybeSingle(),
        sb.from('perfil').select('*').maybeSingle()
      ]);

      const cfg = config || {};
      const per = perfil || {};
      const excluidos = Array.isArray(cfg.excluidos) ? cfg.excluidos : [];

      productos = (filasProductos || [])
        .filter(row => !row.archivado && Number(row.stock) > 0 && !excluidos.includes(row.id))
        .map(row => ({
          id: row.id,
          nombre: row.nombre || '',
          marca: row.marca || '',
          categorias: categoriasDePublico(row),
          formatoVenta: row.formato_venta || '',
          genero: row.genero || '',
          precioVenta: Number(row.precio_venta) || 0,
          enOferta: !!row.en_oferta && Number(row.precio_oferta) > 0 && Number(row.precio_oferta) < Number(row.precio_venta),
          precioOferta: Number(row.precio_oferta) || 0,
          foto: row.foto || '',
          destacado: !!row.destacado
        }));

      heroSlides = Array.isArray(cfg.slides) ? cfg.slides.filter(s=>s.imagen && s.visible !== false) : [];
      marcasCat = Array.isArray(cfg.marcas) ? cfg.marcas.filter(m=>(m.nombre || m.imagen) && m.visible !== false) : [];
      recientesCat = productos.filter(p=>p.destacado);

      telefono = (per.telefono || '').replace(/[^0-9]/g,'');
      const nombreNegocio = per.nombre || cfg.nombre_negocio || 'Catálogo';
      const sobreNosotrosTexto = cfg.eslogan || 'Nos dedicamos a traerte los mejores productos de belleza natural, ofreciéndote siempre los precios más convenientes. Contamos con stock para entrega inmediata y venta por catálogo.';
      heroFallbackTitulo = nombreNegocio;
      heroFallbackSubtitulo = sobreNosotrosTexto;

      document.getElementById('tituloPagina').textContent = nombreNegocio;
      document.getElementById('headerLogoContenido').innerHTML = cfg.logo
        ? '<img src="'+cfg.logo+'" alt="'+nombreNegocio.replace(/</g,'').replace(/"/g,'')+'">'
        : '<h1>'+nombreNegocio.replace(/</g,'')+'</h1>';

      document.getElementById('footerSobreTexto').textContent = sobreNosotrosTexto;
      document.getElementById('footerEnlaceRevista').innerHTML = cfg.revista_digital
        ? '<a class="footer-revista" href="'+cfg.revista_digital.replace(/</g,'')+'" target="_blank">📖 Ver Revista Digital</a>'
        : '';

      const filasRedes = [
        per.instagram ? '<a href="https://instagram.com/'+per.instagram.replace(/^@/,'').replace(/</g,'')+'" target="_blank">Instagram</a>' : '',
        per.facebook ? '<a href="'+(/^https?:\/\//.test(per.facebook) ? per.facebook.replace(/</g,'') : 'https://facebook.com/'+per.facebook.replace(/</g,''))+'" target="_blank">Facebook</a>' : ''
      ].filter(Boolean).join('');
      const filasContacto = [
        telefono ? '<a href="https://wa.me/'+telefono+'" target="_blank">💬 WhatsApp</a>' : '',
        per.correo ? '<a href="mailto:'+per.correo.replace(/</g,'')+'">✉️ Email</a>' : ''
      ].filter(Boolean).join('');
      document.getElementById('footerRedesWrap').innerHTML = filasRedes ? '<div class="footer-col"><h3>Síguenos</h3>'+filasRedes+'</div>' : '';
      document.getElementById('footerContactoWrap').innerHTML = filasContacto ? '<div class="footer-col"><h3>Contacto</h3>'+filasContacto+'</div>' : '';

      document.getElementById('footerAnio').textContent = new Date().getFullYear();
      document.getElementById('footerNombreNegocio').textContent = nombreNegocio.replace(/</g,'');
    }

    function formatCLP(n){ return '$' + (Number(n)||0).toLocaleString('es-CL'); }

    function precioEfectivo(p){
      return (p.enOferta && p.precioOferta > 0) ? p.precioOferta : p.precioVenta;
    }
    function textoFormatoCategoria(p){
      const categoriasVisibles = (p.categorias || []).filter(c => c.trim().toLowerCase() !== 'oferta');
      const cat = categoriasVisibles.length ? categoriasVisibles.join(', ') : '';
      if(p.formatoVenta && cat) return p.formatoVenta + ' · ' + cat;
      return p.formatoVenta || cat || '';
    }
    function htmlPrecio(p){
      if(p.enOferta && p.precioOferta > 0){
        return '<span style="text-decoration:line-through;opacity:0.55;font-weight:600;font-size:0.55em;line-height:1.2;display:block;color:#6B7280;">'+formatCLP(p.precioVenta)+'</span>' +
               '<span style="color:#F97316;line-height:1.2;display:block;">'+formatCLP(p.precioOferta)+'</span>';
      }
      return formatCLP(p.precioVenta);
    }

    function calcGeometriaCover(natW, natH, boxW, boxH, zoomPct){
      if(!natW || !natH || !boxW || !boxH) return null;
      const baseScale = Math.max(boxW/natW, boxH/natH);
      const scale = baseScale * ((zoomPct||100)/100);
      const dispW = natW*scale, dispH = natH*scale;
      return {
        dispW, dispH,
        maxOffX: Math.max(0,(dispW-boxW)/2),
        maxOffY: Math.max(0,(dispH-boxH)/2)
      };
    }
    function offsetDesdePos(pos, maxOff){ return ((pos!=null?pos:50)-50)/50*maxOff; }

    let vistaPublicaActual = 'inicio';
    let footerEnPantalla = false;

    function abrirLightboxCat(src){
      if(!src) return;
      document.getElementById('lightboxImgCat').src = src;
      document.getElementById('lightboxOverlayCat').classList.add('abierto');
    }
    function cerrarLightboxCat(){
      document.getElementById('lightboxOverlayCat').classList.remove('abierto');
    }
    document.getElementById('btnCerrarLightboxCat').addEventListener('click', cerrarLightboxCat);
    document.getElementById('lightboxOverlayCat').addEventListener('click', (e)=>{
      if(e.target.id === 'lightboxOverlayCat') cerrarLightboxCat();
    });
    document.addEventListener('click', (e)=>{
      const img = e.target.closest('.product-image img, .recientes-img-wrap img');
      if(img) abrirLightboxCat(img.src);
    });

    function mostrarVista(vista){
      vistaPublicaActual = vista;
      document.getElementById('vistaInicio').style.display = vista === 'inicio' ? 'block' : 'none';
      document.getElementById('vistaProductos').style.display = vista === 'productos' ? 'block' : 'none';
      actualizarVisibilidadBotonFiltros();
    }

    function actualizarVisibilidadBotonFiltros(){
      const btn = document.getElementById('btnAbrirFiltrosMovil');
      if(!btn) return;
      const debeMostrarse = vistaPublicaActual === 'productos' && !footerEnPantalla;
      btn.classList.toggle('oculto', !debeMostrarse);
    }

    function actualizarPosicionBotonFiltros(){
      const btn = document.getElementById('btnAbrirFiltrosMovil');
      const barra = document.getElementById('carritoBarra');
      if(!btn || !barra) return;
      const barraVisible = barra.style.display !== 'none' && barra.offsetHeight > 0;
      btn.style.bottom = barraVisible ? (barra.offsetHeight + 14) + 'px' : '18px';
    }

    function aplicarTextoHero(slide){
      const tituloEl = document.getElementById('heroTitulo');
      const subtituloEl = document.getElementById('heroSubtitulo');
      tituloEl.textContent = slide.titulo || '';
      tituloEl.style.display = slide.titulo ? 'block' : 'none';
      subtituloEl.textContent = slide.subtitulo || '';
      subtituloEl.style.display = slide.subtitulo ? 'block' : 'none';
      const heroSection = document.getElementById('heroCarousel');
      if(slide.accionTipo === 'categoria' && slide.accionValor){
        heroSection.style.cursor = 'pointer';
        heroSection.onclick = ()=>{
          categoriasSeleccionadas = new Set([slide.accionValor]);
          marcasSeleccionadas = new Set();
          renderFiltroCategorias();
          renderFiltroMarcas();
          mostrarVista('productos');
          render();
          window.scrollTo({top:0,behavior:'smooth'});
        };
      } else if(slide.accionTipo === 'marca' && slide.accionValor){
        heroSection.style.cursor = 'pointer';
        heroSection.onclick = ()=>{
          marcasSeleccionadas = new Set([slide.accionValor]);
          categoriasSeleccionadas = new Set();
          renderFiltroCategorias();
          renderFiltroMarcas();
          mostrarVista('productos');
          render();
          window.scrollTo({top:0,behavior:'smooth'});
        };
      } else {
        heroSection.style.cursor = 'default';
        heroSection.onclick = null;
      }
    }

    function aplicarGeometriaHero(imgEl, slide){
      if(!imgEl.naturalWidth) return;
      const box = document.getElementById('heroCarousel').getBoundingClientRect();
      const geo = calcGeometriaCover(imgEl.naturalWidth, imgEl.naturalHeight, box.width, box.height, slide.zoom || 100);
      if(!geo) return;
      const offX = offsetDesdePos(slide.posX, geo.maxOffX);
      const offY = offsetDesdePos(slide.posY, geo.maxOffY);
      imgEl.style.width = geo.dispW + 'px';
      imgEl.style.height = geo.dispH + 'px';
      imgEl.style.left = '50%';
      imgEl.style.top = '50%';
      imgEl.style.transform = 'translate(calc(-50% + ' + offX + 'px), calc(-50% + ' + offY + 'px))';
    }

    let slideDeLayerA = null, slideDeLayerB = null;

    function iniciarHeroCarousel(){
      if(heroSlides.length === 0){
        aplicarTextoHero({ titulo: heroFallbackTitulo, subtitulo: heroFallbackSubtitulo });
        return;
      }
      const layerA = document.getElementById('heroLayerA');
      const layerB = document.getElementById('heroLayerB');
      let heroIndex = 0;
      let activo = 'A';
      slideDeLayerA = heroSlides[0];
      layerA.onload = () => aplicarGeometriaHero(layerA, slideDeLayerA);
      layerA.src = heroSlides[0].imagen;
      layerA.classList.add('activo');
      aplicarTextoHero(heroSlides[0]);
      if(heroSlides.length > 1){
        setInterval(()=>{
          heroIndex = (heroIndex + 1) % heroSlides.length;
          const siguiente = heroSlides[heroIndex];
          const entrante = activo === 'A' ? layerB : layerA;
          const saliente = activo === 'A' ? layerA : layerB;
          if(activo === 'A') slideDeLayerB = siguiente; else slideDeLayerA = siguiente;
          entrante.onload = () => aplicarGeometriaHero(entrante, siguiente);
          entrante.src = siguiente.imagen;
          entrante.classList.add('activo');
          saliente.classList.remove('activo');
          activo = activo === 'A' ? 'B' : 'A';
          aplicarTextoHero(siguiente);
        }, 4500);
      }
      let resizeHeroTimeout;
      window.addEventListener('resize', ()=>{
        clearTimeout(resizeHeroTimeout);
        resizeHeroTimeout = setTimeout(()=>{
          if(slideDeLayerA) aplicarGeometriaHero(layerA, slideDeLayerA);
          if(slideDeLayerB) aplicarGeometriaHero(layerB, slideDeLayerB);
        }, 150);
      });
    }

    function aplicarGeometriaMarcaPublic(imgEl, m){
      if(!imgEl.naturalWidth) return;
      const box = imgEl.parentElement.getBoundingClientRect();
      const geo = calcGeometriaCover(imgEl.naturalWidth, imgEl.naturalHeight, box.width, box.height, m.zoom || 100);
      if(!geo) return;
      const offX = offsetDesdePos(m.posX, geo.maxOffX);
      const offY = offsetDesdePos(m.posY, geo.maxOffY);
      imgEl.style.width = geo.dispW + 'px';
      imgEl.style.height = geo.dispH + 'px';
      imgEl.style.left = '50%';
      imgEl.style.top = '50%';
      imgEl.style.transform = 'translate(calc(-50% + ' + offX + 'px), calc(-50% + ' + offY + 'px))';
    }

    function renderMarcas(){
      const cont = document.getElementById('marcasGrid');
      const seccion = document.getElementById('marcasSection');
      if(marcasCat.length === 0){ seccion.style.display = 'none'; return; }
      cont.innerHTML = marcasCat.map((m, i)=>{
        const tam = m.tamanoTexto || 22;
        const color = m.colorTexto || '#ffffff';
        const imgHtml = m.imagen ? '<img class="marca-img" data-idx="'+i+'">' : '';
        const dataMarca = m.nombre ? ' data-marca="'+m.nombre.replace(/"/g,'')+'" style="cursor:pointer;"' : '';
        const nombreVisible = m.nombre === '__TODAS__' ? 'Todas las marcas' : (m.nombre||'');
        return '<div class="marca-circulo"'+dataMarca+'>' +
          imgHtml +
          '<div class="marca-overlay"></div>' +
          '<div class="marca-nombre" data-tam="'+tam+'" style="color:'+color+';">'+nombreVisible+'</div>' +
        '</div>';
      }).join('');
      document.querySelectorAll('.marca-img').forEach(imgEl=>{
        const m = marcasCat[Number(imgEl.dataset.idx)];
        if(!m || !m.imagen) return;
        imgEl.onload = () => aplicarGeometriaMarcaPublic(imgEl, m);
        imgEl.src = m.imagen;
      });
      ajustarTamanoTextoMarcas();
      let resizeMarcasTimeout;
      window.addEventListener('resize', ()=>{
        clearTimeout(resizeMarcasTimeout);
        resizeMarcasTimeout = setTimeout(()=>{
          document.querySelectorAll('.marca-img').forEach(imgEl=>{
            const m = marcasCat[Number(imgEl.dataset.idx)];
            if(m) aplicarGeometriaMarcaPublic(imgEl, m);
          });
          ajustarTamanoTextoMarcas();
        }, 150);
      });
    }

    function ajustarTamanoTextoMarcas(){
      document.querySelectorAll('.marca-nombre').forEach(nombreEl=>{
        const tam = Number(nombreEl.dataset.tam) || 22;
        const circulo = nombreEl.closest('.marca-circulo');
        const anchoReal = circulo.getBoundingClientRect().width;
        if(!anchoReal) return;
        const escala = anchoReal / 220;
        nombreEl.style.fontSize = Math.max(9, tam * escala) + 'px';
      });
    }

    document.getElementById('marcasGrid').addEventListener('click', (e)=>{
      const circulo = e.target.closest('.marca-circulo');
      if(!circulo || !circulo.dataset.marca) return;
      marcasSeleccionadas = circulo.dataset.marca === '__TODAS__' ? new Set() : new Set([circulo.dataset.marca]);
      categoriasSeleccionadas = new Set();
      renderFiltroCategorias();
      renderFiltroMarcas();
      mostrarVista('productos');
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    });

    function renderRecientes(){
      const cont = document.getElementById('recientesGrid');
      const seccion = document.getElementById('recientesSection');
      if(recientesCat.length === 0){ seccion.style.display = 'none'; return; }
      cont.innerHTML = recientesCat.map(p=>{
        const imagenHTML = p.foto ? '<img src="'+p.foto+'">' : '🧴';
        return '<div class="recientes-card">' +
          '<div class="recientes-img-wrap">'+imagenHTML+'</div>' +
          '<div class="recientes-info">' +
            '<div class="recientes-marca">'+(p.marca||'')+'</div>' +
            '<div class="recientes-nombre" title="'+p.nombre+'">'+p.nombre+'</div>' +
            '<div class="recientes-formato">'+textoFormatoCategoria(p)+'</div>' +
            '<div class="recientes-footer">' +
              '<span class="recientes-precio">'+htmlPrecio(p)+'</span>' +
              '<button class="recientes-add-btn" onclick="quickAddToCart(\''+p.id+'\')">+</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    let textoBusquedaActual = '';
    let categoriasSeleccionadas = new Set();
    let marcasSeleccionadas = new Set();
    let ordenActivo = 'relevancia';

    function renderFiltroCategorias(){
      const categorias = [...new Set(productos.flatMap(p=>p.categorias||[]))].sort((a,b)=>a.localeCompare(b));
      const grupo = document.getElementById('listaCategoriasFiltro').closest('.filtro-grupo');
      const cont = document.getElementById('listaCategoriasFiltro');
      if(categorias.length === 0){ grupo.style.display = 'none'; return; }
      grupo.style.display = '';
      const todasMarcadas = categoriasSeleccionadas.size === 0;
      let html = '<label class="filtro-check todas"><input type="checkbox" data-todas-cat="1" '+(todasMarcadas?'checked':'')+'> Todas</label>';
      html += categorias.map(c => '<label class="filtro-check"><input type="checkbox" data-cat="'+c+'" '+(categoriasSeleccionadas.has(c)?'checked':'')+'> '+c+'</label>').join('');
      cont.innerHTML = html;
    }

    function renderFiltroMarcas(){
      const marcasDisponibles = [...new Set(productos.map(p=>p.marca).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
      const grupo = document.getElementById('listaMarcasFiltro').closest('.filtro-grupo');
      const cont = document.getElementById('listaMarcasFiltro');
      if(marcasDisponibles.length === 0){ grupo.style.display = 'none'; return; }
      grupo.style.display = '';
      const todasMarcadas = marcasSeleccionadas.size === 0;
      let html = '<label class="filtro-check todas"><input type="checkbox" data-todas-marca="1" '+(todasMarcadas?'checked':'')+'> Todas</label>';
      html += marcasDisponibles.map(m => '<label class="filtro-check"><input type="checkbox" data-marca="'+m+'" '+(marcasSeleccionadas.has(m)?'checked':'')+'> '+m+'</label>').join('');
      cont.innerHTML = html;
    }

    function obtenerListaFiltrada(){
      const texto = textoBusquedaActual.toLowerCase();
      let lista = productos.filter(p => (p.nombre+' '+p.marca).toLowerCase().includes(texto));
      if(categoriasSeleccionadas.size > 0) lista = lista.filter(p => (p.categorias||[]).some(c=>categoriasSeleccionadas.has(c)));
      if(marcasSeleccionadas.size > 0) lista = lista.filter(p => marcasSeleccionadas.has(p.marca));
      if(ordenActivo === 'precio-asc') lista = [...lista].sort((a,b)=> a.precioVenta - b.precioVenta);
      else if(ordenActivo === 'precio-desc') lista = [...lista].sort((a,b)=> b.precioVenta - a.precioVenta);
      else if(ordenActivo === 'nombre-asc') lista = [...lista].sort((a,b)=> a.nombre.localeCompare(b.nombre));
      else if(ordenActivo === 'nombre-desc') lista = [...lista].sort((a,b)=> b.nombre.localeCompare(a.nombre));
      return lista;
    }

    function render(){
      const lista = obtenerListaFiltrada();
      const grid = document.getElementById('grid');
      if(lista.length === 0){ grid.innerHTML = '<div class="vacio-cat">No hay productos que coincidan.</div>'; return; }
      grid.innerHTML = lista.map(p => {
        const imagenHTML = p.foto ? '<img src="'+p.foto+'">' : '🧴';
        return '<div class="product-card">' +
          '<div class="product-image">' + imagenHTML + '</div>' +
          '<div class="product-info">' +
            '<div class="product-category">'+(p.marca||'')+'</div>' +
            '<div class="product-name" title="'+p.nombre+'">'+p.nombre+'</div>' +
            '<div class="product-description">'+textoFormatoCategoria(p)+'</div>' +
            '<div class="product-footer">' +
              '<span class="product-price">'+htmlPrecio(p)+'</span>' +
              '<button class="product-add-btn" onclick="quickAddToCart(\''+p.id+'\')">+</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function quickAddToCart(id){
      const producto = productos.find(p => p.id === id);
      if(!producto) return;
      carrito[id] = { producto, cantidad: (carrito[id] ? carrito[id].cantidad : 0) + 1 };
      actualizarBarra();
      renderCarritoModal();
    }

    function cambiarCantidadCarrito(id, delta){
      if(!carrito[id]) return;
      carrito[id].cantidad += delta;
      if(carrito[id].cantidad <= 0) delete carrito[id];
      actualizarBarra();
      renderCarritoModal();
    }

    function quitarDelCarrito(id){
      delete carrito[id];
      actualizarBarra();
      renderCarritoModal();
    }

    function actualizarBarra(){
      const items = Object.values(carrito);
      const cantidadTotal = items.reduce((s,i)=>s+i.cantidad,0);
      const total = items.reduce((s,i)=>s+i.cantidad*precioEfectivo(i.producto),0);
      document.getElementById('carritoBarra').style.display = items.length ? 'flex' : 'none';
      document.getElementById('carritoCantidad').textContent = cantidadTotal;
      document.getElementById('carritoTotal').textContent = formatCLP(total);
      const badge = document.getElementById('headerCarritoBadge');
      badge.textContent = cantidadTotal;
      badge.style.display = cantidadTotal > 0 ? 'flex' : 'none';
      actualizarPosicionBotonFiltros();
    }

    function renderCarritoModal(){
      const body = document.getElementById('carritoModalBody');
      const items = Object.values(carrito);
      if(items.length === 0){
        body.innerHTML = '<div class="carrito-vacio">Tu carrito está vacío</div>';
      } else {
        body.innerHTML = items.map(i => {
          const img = i.producto.foto ? '<img src="'+i.producto.foto+'">' : '🧴';
          const precioUnit = precioEfectivo(i.producto);
          return '<div class="carrito-item">' +
            '<div class="carrito-item-img">'+img+'</div>' +
            '<div class="carrito-item-info">' +
              '<div class="carrito-item-nombre" title="'+i.producto.nombre+'">'+i.producto.nombre+'</div>' +
              '<div class="carrito-item-precio">'+formatCLP(precioUnit)+' c/u</div>' +
            '</div>' +
            '<div class="carrito-item-cantidad">' +
              '<button class="carrito-qty-btn" onclick="cambiarCantidadCarrito(\''+i.producto.id+'\',-1)">−</button>' +
              '<span class="carrito-item-qty-num">'+i.cantidad+'</span>' +
              '<button class="carrito-qty-btn" onclick="cambiarCantidadCarrito(\''+i.producto.id+'\',1)">+</button>' +
            '</div>' +
            '<div class="carrito-item-subtotal">'+formatCLP(i.cantidad*precioUnit)+'</div>' +
            '<button class="carrito-item-eliminar" onclick="quitarDelCarrito(\''+i.producto.id+'\')" title="Quitar">🗑</button>' +
          '</div>';
        }).join('');
      }
      const total = items.reduce((s,i)=>s+i.cantidad*precioEfectivo(i.producto),0);
      document.getElementById('carritoModalTotal').textContent = formatCLP(total);
      document.getElementById('btnEnviarModal').disabled = items.length === 0;
    }

    function abrirCarrito(){
      renderCarritoModal();
      document.getElementById('carritoOverlay').classList.add('abierto');
    }
    function cerrarCarrito(){
      document.getElementById('carritoOverlay').classList.remove('abierto');
    }

    function enviarPedidoWhatsApp(){
      const items = Object.values(carrito);
      if(items.length === 0) return;
      let mensaje = 'Hola, quiero hacer este pedido:%0A%0A';
      items.forEach(i=>{
        mensaje += '• ' + i.producto.nombre + ' x' + i.cantidad + ' - ' + formatCLP(i.cantidad*precioEfectivo(i.producto)) + '%0A';
      });
      const total = items.reduce((s,i)=>s+i.cantidad*precioEfectivo(i.producto),0);
      mensaje += '%0ATotal: ' + formatCLP(total);
      const url = telefono ? ('https://wa.me/'+telefono+'?text='+mensaje) : ('https://wa.me/?text='+mensaje);
      window.open(url, '_blank');
    }

    document.getElementById('buscar').addEventListener('input', (e)=>{
      textoBusquedaActual = e.target.value;
      mostrarVista('productos');
      render();
    });
    document.getElementById('listaCategoriasFiltro').addEventListener('change', (e)=>{
      const input = e.target;
      if(input.dataset.todasCat){
        categoriasSeleccionadas.clear();
      } else if(input.dataset.cat){
        if(input.checked) categoriasSeleccionadas.add(input.dataset.cat);
        else categoriasSeleccionadas.delete(input.dataset.cat);
      }
      renderFiltroCategorias();
      render();
    });
    document.getElementById('listaMarcasFiltro').addEventListener('change', (e)=>{
      const input = e.target;
      if(input.dataset.todasMarca){
        marcasSeleccionadas.clear();
      } else if(input.dataset.marca){
        if(input.checked) marcasSeleccionadas.add(input.dataset.marca);
        else marcasSeleccionadas.delete(input.dataset.marca);
      }
      renderFiltroMarcas();
      render();
    });
    document.getElementById('ordenComboTrigger').addEventListener('click', (e)=>{
      e.stopPropagation();
      document.getElementById('ordenCombo').classList.toggle('abierto');
    });
    document.getElementById('ordenComboPanel').addEventListener('click', (e)=>{
      const item = e.target.closest('.orden-combo-item');
      if(!item) return;
      ordenActivo = item.dataset.valor;
      document.getElementById('ordenComboTexto').textContent = item.textContent;
      document.querySelectorAll('.orden-combo-item').forEach(el => el.classList.toggle('activo', el === item));
      document.getElementById('ordenCombo').classList.remove('abierto');
      render();
    });
    document.addEventListener('click', (e)=>{
      if(!e.target.closest('.orden-combo')) document.getElementById('ordenCombo').classList.remove('abierto');
    });
    document.getElementById('navInicio').addEventListener('click', (e)=>{ e.preventDefault(); mostrarVista('inicio'); window.scrollTo({top:0,behavior:'smooth'}); });
    document.getElementById('headerLogo').addEventListener('click', ()=>{ mostrarVista('inicio'); window.scrollTo({top:0,behavior:'smooth'}); });
    document.getElementById('navProductos').addEventListener('click', (e)=>{ e.preventDefault(); mostrarVista('productos'); window.scrollTo({top:0,behavior:'smooth'}); });
    document.getElementById('navContacto').addEventListener('click', (e)=>{
      e.preventDefault();
      document.getElementById('pie-catalogo').scrollIntoView({ behavior:'smooth', block:'start' });
    });
    document.getElementById('headerCarrito').addEventListener('click', abrirCarrito);
    document.getElementById('carritoInfoClick').addEventListener('click', abrirCarrito);
    document.getElementById('btnCerrarCarrito').addEventListener('click', cerrarCarrito);
    document.getElementById('carritoOverlay').addEventListener('click', (e)=>{
      if(e.target.id === 'carritoOverlay') cerrarCarrito();
    });
    document.getElementById('btnEnviar').addEventListener('click', enviarPedidoWhatsApp);
    document.getElementById('btnEnviarModal').addEventListener('click', enviarPedidoWhatsApp);

    function abrirFiltrosMovil(){
      document.getElementById('filtrosSidebar').classList.add('abierto-movil');
      document.getElementById('filtrosBackdropMovil').classList.add('abierto');
    }
    function cerrarFiltrosMovil(){
      document.getElementById('filtrosSidebar').classList.remove('abierto-movil');
      document.getElementById('filtrosBackdropMovil').classList.remove('abierto');
    }
    document.getElementById('btnAbrirFiltrosMovil').addEventListener('click', abrirFiltrosMovil);
    document.getElementById('btnCerrarFiltrosMovil').addEventListener('click', cerrarFiltrosMovil);
    document.getElementById('filtrosBackdropMovil').addEventListener('click', cerrarFiltrosMovil);

    const pieCatalogoEl = document.getElementById('pie-catalogo');
    if('IntersectionObserver' in window && pieCatalogoEl){
      const observerFiltros = new IntersectionObserver((entradas)=>{
        entradas.forEach(entrada=>{
          footerEnPantalla = entrada.isIntersecting;
          actualizarVisibilidadBotonFiltros();
        });
      }, { threshold: 0 });
      observerFiltros.observe(pieCatalogoEl);
    }

    (async function iniciar(){
      await cargarDatosPublicos();
      mostrarVista('inicio');
      iniciarHeroCarousel();
      renderMarcas();
      renderRecientes();
      renderFiltroCategorias();
      renderFiltroMarcas();
      actualizarPosicionBotonFiltros();
      render();
    })();
  </script>
</body>
</html>
